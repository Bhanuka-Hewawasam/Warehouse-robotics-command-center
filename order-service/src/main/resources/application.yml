server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    # Port 3308 matches the "mysql-order-db" container's host port in docker-compose.yml
    url: jdbc:mysql://localhost:3308/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # "update" auto-creates/updates tables from the Order entity - fine for dev,
      # would use Flyway/Liquibase migrations instead in a real production system
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.warehouse.order: DEBUG
