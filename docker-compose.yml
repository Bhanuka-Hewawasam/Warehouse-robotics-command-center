version: '3.8'

# Infrastructure only for now (Phase 0).
# Robot/Order/Notification service containers will be added here in Phase 4-5
# once each service is built and tested locally via IntelliJ first.

services:

  mysql-robot-db:
    image: mysql:8.0
    container_name: mysql-robot-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: robot_db
    ports:
      - "3307:3306"
    volumes:
      - robot_db_data:/var/lib/mysql

  mysql-order-db:
    image: mysql:8.0
    container_name: mysql-order-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
    ports:
      - "3308:3306"
    volumes:
      - order_db_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP port (used by Spring Boot services)
      - "15672:15672"   # Management UI -> http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  robot_db_data:
  order_db_data:
