server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Automatically creates routes based on service names registered in Eureka
      # e.g. http://localhost:8080/robot-service/api/robots -> forwards to robot-service
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Clean, human-friendly route: /api/robots/** -> robot-service
        - id: robot-service
          uri: lb://robot-service
          predicates:
            - Path=/api/robots/**

        # Clean route: /api/orders/** -> order-service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

        # WebSocket route: /ws/** -> notification-service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/ws/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"   # React dev server (Vite)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
